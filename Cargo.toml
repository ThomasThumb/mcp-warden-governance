# Workspace root for MCP Warden Governance.
#
# Both crates MUST resolve the crypto stack (ed25519-dalek, ml-dsa, sha2,
# base64) to identical versions: warden-cp signs tokens/audit rows and
# mcp-warden verifies them. A single workspace lockfile makes that a
# guarantee instead of a coincidence between two lockfiles.

[workspace]
resolver = "2"
members = [
    "warden-cp",
    "mcp-warden/mcp-warden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Dependencies shared by both crates. Members inherit the version here and
# may add crate-specific features with `{ workspace = true, features = [...] }`.
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
futures-util = "0.3"
ml-dsa = "0.1.1"
# The published 0.10.1 crate pins yanked spin 0.10.0. Microsoft updated that
# dependency to spin 0.12 in the verified upstream commit below after the
# release. Keep the revision immutable until the next crates.io release.
regorus = { version = "0.10.1", git = "https://github.com/microsoft/regorus", rev = "ba7d29b134d75d3d1ac82c1831ed0927cda67e2d", default-features = false, features = ["opa-no-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
