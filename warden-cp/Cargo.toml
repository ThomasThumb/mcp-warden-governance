[package]
name = "warden-cp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Control plane for mcp-warden: inventory, allowlists/drift, scoped identity, audit + approvals"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
# Shared with mcp-warden via [workspace.dependencies] — versions live in the
# workspace root so the token/audit signer and verifier can never skew.
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
# Classical signing now; see src/identity.rs for the ML-DSA (PQC) hybrid slot.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
futures-util.workspace = true
ml-dsa = { workspace = true, features = ["getrandom", "zeroize"] }
regorus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# warden-cp only
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = "0.26"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "macros", "migrate"] }
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "10.3"
wait-timeout = "0.2"
tower = { version = "0.5", features = ["util"] }
