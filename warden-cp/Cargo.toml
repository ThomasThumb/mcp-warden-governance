[package]
name = "warden-cp"
version = "0.1.0"
edition = "2021"
description = "Control plane for mcp-warden: inventory, allowlists/drift, scoped identity, audit + approvals"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# Classical signing now; see src/identity.rs for the ML-DSA (PQC) hybrid slot.
ed25519-dalek = { version = "2", features = ["rand_core"] }
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize"] }
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
regorus = { version = "0.10.1", default-features = false, features = ["opa-no-std"] }
jsonwebtoken = "9"
