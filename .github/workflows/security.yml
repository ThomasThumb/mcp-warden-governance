name: Rust Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-security:
    name: Check, test, audit, and deny advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check warden-cp SQLite build
        run: cargo check --manifest-path warden-cp/Cargo.toml

      - name: Check warden-cp Postgres build
        run: cargo check --manifest-path warden-cp/Cargo.toml --no-default-features --features postgres

      - name: Test warden-cp
        run: cargo test --manifest-path warden-cp/Cargo.toml

      - name: Audit warden-cp
        working-directory: warden-cp
        run: cargo audit

      - name: Deny warden-cp advisories
        working-directory: warden-cp
        run: cargo deny check advisories

      - name: Check mcp-warden
        run: cargo check --manifest-path mcp-warden/mcp-warden/Cargo.toml

      - name: Test mcp-warden
        run: cargo test --manifest-path mcp-warden/mcp-warden/Cargo.toml

      - name: Audit mcp-warden
        working-directory: mcp-warden/mcp-warden
        run: cargo audit

      - name: Deny mcp-warden advisories
        working-directory: mcp-warden/mcp-warden
        run: cargo deny check advisories
