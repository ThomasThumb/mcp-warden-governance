# CI for the workspace: format, lint, test (both DB backends, Linux+Windows),
# and supply-chain checks (advisories, licenses, bans, sources).
#
# Conventions:
# - Every third-party action is pinned to a full commit SHA (tag in comment).
# - Every cargo invocation uses --locked: CI must test exactly the committed
#   Cargo.lock, never a fresh resolution.
# - The toolchain comes from rust-toolchain.toml via `rustup toolchain install`,
#   so CI and local builds cannot drift.
name: Rust Security

on:
  pull_request:
  # Run on every pushed branch. This repository's default branch is not
  # assumed to be named "main", and hardening branches need the same gate.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede stale pull-request runs. Never cancel a pushed branch gate,
  # regardless of the repository's default-branch name.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: clippy (warden-cp, postgres backend)
        run: cargo clippy -p warden-cp --no-default-features --features postgres --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest exists specifically to catch MSVC-only build failures
        # (e.g. Spectre-mitigated library requirements) before contributors do.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test workspace (sqlite default)
        run: cargo test --workspace --locked

      - name: Test warden-cp (postgres backend)
        run: cargo test -p warden-cp --no-default-features --features postgres --locked

  supply-chain:
    name: Advisories, licenses, bans, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5

      - name: Install cargo-audit and cargo-deny (prebuilt)
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        run: cargo audit

      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny check


  container-security:
    name: Build and scan production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@6026fb2ad3aa556d78b517cf65c8c1f832075860 # v5

      - name: Build production application image
        run: docker build -f warden-cp/Dockerfile -t warden-cp:security .

      - name: Verify production signer policy is fail closed
        run: |
          docker inspect warden-cp:security --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx 'WARDEN_REQUIRE_EXTERNAL_SIGNER=true'

      - name: Build hardened PostgreSQL 17 image
        run: docker build -f warden-cp/deploy/postgres/Dockerfile -t warden-postgres:security .

      - name: Scan image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: warden-cp:security
          version: v0.72.0
          hide-progress: "true"
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          format: table

      - name: Scan PostgreSQL image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: warden-postgres:security
          version: v0.72.0
          hide-progress: "true"
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
          format: table
