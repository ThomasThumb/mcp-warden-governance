[package]
name = "mcp-warden"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A zero-trust security and governance proxy for MCP servers"

[dependencies]
# Shared with warden-cp via [workspace.dependencies] — versions live in the
# workspace root so the token/audit signer and verifier can never skew.
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
ml-dsa.workspace = true
regorus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# mcp-warden only
# Official Rust MCP SDK. We deliberately skip the "macros" feature: this gateway
# proxies a *dynamic* tool set discovered at runtime from upstream servers, so we
# implement ServerHandler/ClientHandler by hand instead of the static #[tool] macros.
rmcp = { version = "2", default-features = false, features = [
    "server",
    "client",
    "transport-child-process",
    "transport-io",
] }
toml = "0.8"
regex = "1"
serde_ignored = "0.1"
